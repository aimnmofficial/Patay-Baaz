<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#0b1f1a">
<title>Pattay Baaz</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#07140f;color:#f3efe2;font-family:'Baloo 2',system-ui,sans-serif;overflow:hidden;user-select:none;-webkit-user-select:none;touch-action:manipulation}
button{font-family:inherit;color:inherit;border:0;cursor:pointer}
[hidden]{display:none!important}
#app{height:100%;max-width:560px;margin:0 auto;position:relative;background:radial-gradient(120% 80% at 50% 0,#12362b,#07140f 70%)}
/* home */
#home{height:100%;overflow-y:auto;padding:26px 16px 30px}
.logo{display:flex;flex-direction:column;align-items:center;margin-bottom:18px}
.fan{position:relative;width:120px;height:92px}
.fan .card{position:absolute;left:35px;top:6px;width:50px;height:72px;transform-origin:50% 120%;animation:fanin .7s both}
.fan .card:nth-child(1){--r:-24deg}.fan .card:nth-child(2){--r:0deg;animation-delay:.1s}.fan .card:nth-child(3){--r:24deg;animation-delay:.2s}
@keyframes fanin{from{transform:rotate(0) translateY(30px);opacity:0}to{transform:rotate(var(--r))}}
h1{font-size:44px;line-height:1;margin:6px 0 0;font-weight:800;background:linear-gradient(#ffe89a,#e9a820);-webkit-background-clip:text;background-clip:text;color:transparent;letter-spacing:.5px}
.tagline{opacity:.75;font-size:15px;margin-top:4px;text-align:center}
#tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{position:relative;text-align:left;padding:14px 14px 12px;border-radius:18px;background:linear-gradient(160deg,#173f33,#0e2a22);border:1px solid #ffffff1a;box-shadow:0 6px 18px #0006;display:flex;flex-direction:column;overflow:hidden;transition:transform .12s}
.tile:active{transform:scale(.96)}
.tile .ti{position:absolute;right:-6px;top:-18px;font-size:86px;color:var(--c);opacity:.2}
.tile .tn{font-size:22px;font-weight:800;color:var(--c);line-height:1.1}
.tile .tt{font-size:13px;opacity:.8;min-height:34px;line-height:1.25;margin-top:2px}
.tile .tp{font-size:12px;margin-top:8px;background:#0005;border-radius:99px;padding:1px 10px;align-self:flex-start}
.foot{text-align:center;opacity:.5;font-size:12px;margin-top:20px}
/* cards */
.card{width:52px;height:74px;border-radius:8px;background:linear-gradient(#fff,#f1ede1);color:#1a1a22;box-shadow:0 2px 6px #0007,inset 0 0 0 1px #0002;position:relative;font-family:Georgia,serif}
.card.red{color:#d2203a}
.card i{position:absolute;left:4px;top:3px;font-style:normal;font-weight:700;font-size:15px;line-height:.95;text-align:center}
.card b{position:absolute;right:5px;bottom:1px;font-size:30px;font-weight:400;line-height:1.1}
.card.back{background:repeating-linear-gradient(45deg,#8c1d2c 0 5px,#a8283a 5px 10px);box-shadow:0 2px 6px #0007,inset 0 0 0 3px #f6e9c8,inset 0 0 0 4px #0003}
/* game */
#game{height:100%;display:flex;flex-direction:column}
header{display:flex;align-items:center;gap:8px;padding:8px 10px 4px}
header button{width:38px;height:38px;border-radius:12px;background:#ffffff14;font-size:17px;flex:none}
.hd{flex:1;min-width:0;text-align:center}
#gname{font-weight:800;font-size:18px;color:#ffd866;line-height:1}
#status{font-size:12.5px;opacity:.85;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#table{flex:1;position:relative;min-height:230px;margin:14px 8px 2px}
#felt{position:absolute;inset:7% 9% 9%;border-radius:46%;background:radial-gradient(#23805f,#125240 70%,#0c3a2d);box-shadow:inset 0 0 40px #0008,0 0 0 7px #5b3a1c,0 0 0 9px #2d1b0b,0 10px 30px #000a}
#seats,#center{position:absolute;inset:0}
.seat{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;width:104px;pointer-events:none;z-index:30;transition:opacity .3s}
.seat.outp{opacity:.45}
.av{width:44px;height:44px;border-radius:50%;background:linear-gradient(#3b5d8f,#22395c);display:grid;place-items:center;font-weight:800;font-size:20px;border:2px solid #ffffff40;position:relative;box-shadow:0 3px 8px #0008}
.seat.turn .av{border-color:#ffd866;animation:pulse 1s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 7px #ffd86644,0 3px 8px #0008}}
.cnt{position:absolute;right:-10px;bottom:-4px;min-width:20px;height:24px;padding:0 3px;border-radius:5px;background:#a8283a;border:1.5px solid #f6e9c8;font-size:12px;display:grid;place-items:center}
.nm{font-size:13px;font-weight:700;background:#000a;border-radius:99px;padding:0 9px;margin-top:2px;line-height:1.4}
.inf,#meinf{font-size:11px;text-align:center;line-height:1.35}
.inf u,#meinf u{text-decoration:none;color:#ffd866;font-weight:700}
.inf em,#meinf em{font-style:normal;display:inline-block;background:#fff;color:#222;border-radius:4px;padding:0 4px;margin:1px;font-weight:700;font-family:Georgia,serif}
.inf em.lk,#meinf em.lk{background:#ffd866}
.inf b,#meinf b{color:#ffd866}
#meinf{min-height:16px;font-size:12px;padding:0 10px}
#center.trick .tc{position:absolute;margin:-37px 0 0 -26px}
#center.row{display:flex;flex-wrap:wrap;justify-content:center;align-content:center;gap:6px;padding:22% 17% 24%}
#center.row.many{gap:4px}
#center.row.many .tc{width:38px;height:54px}
#center.row.many .tc b{font-size:20px}#center.row.many .tc i{font-size:13px}
.tc{animation:fly .38s cubic-bezier(.2,.8,.3,1) both}
.tc.pop{animation:pop .3s both}.tc.flip{animation:flip .5s both}
@keyframes fly{from{transform:translate(var(--dx),var(--dy)) scale(.6) rotate(18deg);opacity:.2}}
@keyframes pop{from{transform:scale(.3);opacity:0}}
@keyframes flip{from{transform:rotateY(90deg) scale(1.15)}to{transform:none}}
#flash{position:absolute;left:50%;top:44%;transform:translate(-50%,-50%) scale(.5);opacity:0;pointer-events:none;z-index:60;background:linear-gradient(#ffe89a,#f0b429);color:#3a2300;font-weight:800;font-size:19px;line-height:1.2;padding:9px 18px;border-radius:16px;text-align:center;max-width:86%;box-shadow:0 8px 30px #000a}
#flash.go{animation:fl 2.1s both}
@keyframes fl{0%{transform:translate(-50%,-50%) scale(.4);opacity:0}12%{transform:translate(-50%,-50%) scale(1.08);opacity:1}20%{transform:translate(-50%,-50%) scale(1)}80%{opacity:1;transform:translate(-50%,-50%) scale(1)}100%{opacity:0;transform:translate(-50%,-70%) scale(.9)}}
#msg{position:absolute;left:0;right:0;bottom:0;display:flex;gap:6px;justify-content:center;flex-wrap:wrap;z-index:40;pointer-events:none}
#msg span{background:#000a;border-radius:99px;padding:1px 12px;font-size:13.5px}
#msg span.you{background:#ffd866;color:#2c1c00;font-weight:800}
#hint{text-align:center;font-size:13px;opacity:.85;min-height:20px;padding:2px 12px 0;line-height:1.25}
#hand{position:relative;margin:0 6px;transition:height .2s}
.hc{position:absolute;width:var(--cw);height:calc(var(--cw)*1.42);transition:left .25s,top .25s,transform .15s,filter .2s;cursor:pointer}
.hc.deal{animation:deal .35s both}
@keyframes deal{from{transform:translateY(-220px) rotate(-20deg) scale(.6);opacity:0}}
.hc.sel{transform:translateY(-16px);box-shadow:0 0 0 3px #ffd866,0 8px 14px #0008}
.hc.dim{filter:brightness(.55)}
.hc.glow{box-shadow:0 0 0 3px #4ade80,0 0 14px #4ade80}
.hc.new::after{content:'naya';position:absolute;left:50%;top:-9px;transform:translateX(-50%);background:#4dd0e1;color:#012;font:700 9px system-ui;padding:0 5px;border-radius:9px}
.hc.shake{animation:shake .3s}
@keyframes shake{25%{margin-left:-5px}75%{margin-left:5px}}
#strip{display:flex;gap:5px;justify-content:center;flex-wrap:wrap;padding:0 8px}
#strip .chip{min-width:30px;padding:1px 7px;font-size:14px}
#btns{display:flex;gap:8px;justify-content:center;padding:6px 10px calc(10px + env(safe-area-inset-bottom));min-height:60px;flex-wrap:wrap}
.btn{min-width:86px;height:44px;padding:0 16px;border-radius:14px;background:#ffffff1f;font-size:17px;font-weight:700;border:1px solid #ffffff26;transition:transform .1s}
.btn:active{transform:scale(.94)}
.btn.pri{background:linear-gradient(#ffe07a,#e9a820);color:#2c1c00;border:0;box-shadow:0 4px 0 #9a6a08}
.btn.warn{background:linear-gradient(#ff7b7b,#d63447);border:0;box-shadow:0 4px 0 #7d1522;animation:pulse2 .8s infinite}
@keyframes pulse2{50%{transform:scale(1.06)}}
.btn.red{color:#ff6b7f;font-size:24px;background:#fff}.btn.blk{color:#111;font-size:24px;background:#fff}
.btn:disabled{opacity:.4;box-shadow:none}
#badge{position:absolute;left:2px;top:0;z-index:45;background:#000b;border:2px solid #ffd866;border-radius:14px;padding:3px 8px 4px;text-align:center;line-height:1.1;max-width:104px}
#badge small{display:block;font-size:11px;color:#ffd866;font-weight:700}
#badge .bs{width:44px;height:44px;margin:2px auto;border-radius:10px;background:#fff;color:#111;font:38px/44px Georgia,serif}
#badge .bs.red{color:#d2203a}#badge .bs.q{color:#999;font-weight:700}
#hno{position:absolute;right:2px;top:0;z-index:45;background:#000b;border-radius:99px;padding:1px 10px;font-size:13px;font-weight:700}
.seat.turn .nm{background:#ffd866;color:#2c1c00}
#game.myturn #hand{filter:drop-shadow(0 0 10px #ffd86688)}
#msg span.you{font-size:16px;padding:2px 16px;animation:pulse2 .9s infinite}
.log{text-align:left;font:12.5px/1.4 system-ui,sans-serif;margin:8px 0;max-height:34vh;overflow-y:auto}
.log summary{font:700 15px 'Baloo 2',sans-serif;color:#ffd866;text-align:center;cursor:pointer;padding:4px}
.log div{padding:4px 2px;border-top:1px solid #ffffff1a}.log i{color:#ffd866;font-style:normal}
.log.open{max-height:none}
.card.low::after{content:'= 2';position:absolute;left:50%;top:-10px;transform:translateX(-50%);background:#ff5a5a;color:#fff;font:700 11px system-ui;padding:1px 7px;border-radius:9px;white-space:nowrap;z-index:3}
b.dk{display:block;white-space:nowrap;font-size:11.5px}
#meinf .mini{margin-right:12px}#meinf b.dk{display:inline;font-size:13px;margin-right:6px}
.inf .mini{display:table;margin:3px auto 3px}
.mini{display:inline-block;position:relative;background:#fff;color:#111;border-radius:5px;font:700 15px/1 Georgia,serif;padding:7px 5px 6px;margin:2px 6px 2px 0;vertical-align:middle;box-shadow:0 0 0 2px #ffd866,0 2px 5px #0008}
.mini.red{color:#d2203a}
.mini s{position:absolute;right:-9px;top:-8px;background:#ffd866;color:#2c1c00;border-radius:9px;font:700 10px system-ui;padding:1px 4px;text-decoration:none}
/* online */
.onl{margin:0 0 2px;background:linear-gradient(#7ee0a1,#2fae62);box-shadow:0 5px 0 #17703a;color:#04260f}
.onl:active{box-shadow:0 2px 0 #17703a}
input{width:100%;height:48px;border-radius:14px;border:1px solid #ffffff33;background:#0006;color:#fff;font:700 19px 'Baloo 2',sans-serif;padding:0 14px;outline:none;margin-top:4px}
input:focus{border-color:#ffd866}
.row{display:flex;gap:8px;align-items:center;margin-top:4px}.row input{margin:0}
#lobby{height:100%;overflow-y:auto}
.lwrap{padding:4px 18px 30px}
.code{font-size:64px;font-weight:800;letter-spacing:10px;text-align:center;color:#ffd866;line-height:1.1;text-indent:10px}
.ls{display:flex;align-items:center;gap:10px;background:#ffffff12;border-radius:14px;padding:6px 10px;margin-top:6px;font-size:17px;font-weight:700}
.ls.bot{opacity:.55}.ls .av{width:36px;height:36px;font-size:17px;flex:none}
.ls .tm{margin-left:auto;font-style:normal;font-size:12px;border-radius:99px;padding:0 9px}.tm.t0{background:#ffd866;color:#2c1c00}.tm.t1{background:#4dd0e1;color:#012}
.wait{text-align:center;margin-top:18px;font-size:17px;opacity:.9}
.chip:disabled{opacity:.3}
#toast{position:absolute;left:50%;bottom:90px;transform:translateX(-50%);background:#000e;border:1px solid #ffffff33;border-radius:14px;padding:8px 16px;font-size:15px;max-width:86%;text-align:center;z-index:200;opacity:0;pointer-events:none}
#toast.go{animation:tst 3.4s both}
@keyframes tst{8%{opacity:1}85%{opacity:1}100%{opacity:0}}
/* modal */
#modal,#over{position:absolute;inset:0;z-index:100;background:#000b;display:grid;place-items:end center;overflow:hidden}
#over{place-items:center}
.sheet{width:100%;max-height:88%;overflow-y:auto;background:#12281f;border-radius:22px 22px 0 0;padding:18px 18px 24px;position:relative;animation:up .25s;border-top:1px solid #ffffff2a}
@keyframes up{from{transform:translateY(60%)}}
.sheet h2{margin:0;font-size:26px;line-height:1.1}.sub{margin:2px 0 8px;opacity:.75}
.x{position:absolute;right:12px;top:12px;width:34px;height:34px;border-radius:50%;background:#ffffff1a}
.lab{font-size:13px;opacity:.7;margin-top:10px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:4px}
.chip{padding:4px 16px;border-radius:99px;background:#ffffff14;font-size:16px;font-weight:700;border:1px solid #ffffff22}
.chip.on{background:#ffd866;color:#2c1c00}
.rules{padding-left:18px;margin:12px 0;font:14px/1.45 system-ui,sans-serif;opacity:.9}
.rules li{margin-bottom:5px}
.big{width:100%;height:52px;border-radius:16px;background:linear-gradient(#ffe07a,#e9a820);color:#2c1c00;font-size:21px;font-weight:800;box-shadow:0 5px 0 #9a6a08;margin-top:8px}
.big:active{transform:translateY(3px);box-shadow:0 2px 0 #9a6a08}
.ghost{width:100%;height:44px;background:none;font-size:16px;opacity:.8;margin-top:8px}
.ocard{width:86%;max-width:380px;background:#12281f;border-radius:24px;padding:20px;text-align:center;border:2px solid #ffffff2a;animation:pop .35s;z-index:2}
.ocard.win{border-color:#ffd866}
.ocard h2{margin:0 0 6px;font-size:30px;color:#ffd866}.ocard.lose h2{color:#ff8a8a}
.ocard p{margin:2px 0;font-size:15px;opacity:.9}
.oemo{font-size:54px;line-height:1.1}
.conf{position:absolute;top:-12px;width:9px;height:15px;border-radius:2px;animation:fall linear both;z-index:1}
@keyframes fall{to{transform:translateY(105vh) rotate(720deg)}}
@media (min-height:760px){.card{width:56px;height:80px}#center.trick .tc{margin:-40px 0 0 -28px}}
</style>
</head>
<body>
<div id="app">
  <div id="home">
    <div class="logo">
      <div class="fan"><div class="card red"><i>A<br>♥&#xFE0E;</i><b>♥&#xFE0E;</b></div><div class="card"><i>K<br>♠&#xFE0E;</i><b>♠&#xFE0E;</b></div><div class="card red"><i>2<br>♦&#xFE0E;</i><b>♦&#xFE0E;</b></div></div>
      <h1>Pattay Baaz</h1>
      <div class="tagline">Dosti apni jagah, patte apni jagah</div>
    </div>
    <button id="onl" class="big onl">👥 Doston ke saath khelo</button>
    <div class="lab" style="text-align:center;margin:14px 0 8px">Ya bots ke saath practice</div>
    <div id="tiles"></div>
    <div class="foot">Pattay Baaz · asli shuffle, server par fair game</div>
  </div>
  <div id="game" hidden>
    <header><button id="back">←</button><div class="hd"><div id="gname"></div><div id="status"></div></div><button id="help">?</button><button id="snd"></button></header>
    <div id="table"><div id="felt"></div><div id="center"></div><div id="seats"></div><div id="badge" hidden></div><div id="hno" hidden></div><div id="flash"></div><div id="msg"></div></div>
    <div id="hint"></div>
    <div id="meinf"></div>
    <div id="hand"></div>
    <div id="strip"></div>
    <div id="btns"></div>
    <div id="over" hidden></div>
  </div>
  <div id="lobby" hidden></div>
  <div id="modal" hidden></div>
  <div id="toast"></div>
</div>
<script>/* Pattay Baaz rules engine. Pure logic, no DOM: runs in browser now, on a Node server later. */
(function (root) {
const SUITS = ['♠︎', '♥︎', '♦︎', '♣︎'];
const rl = r => ({ 11: 'J', 12: 'Q', 13: 'K', 14: 'A' })[r] || '' + r;
const cn = c => rl(c.r) + SUITS[c.s];
const CR = root.crypto || require('crypto').webcrypto;
function rnd(n) { if (n <= 1) return 0; const u = new Uint32Array(1), lim = Math.floor(4294967296 / n) * n; do CR.getRandomValues(u); while (u[0] >= lim); return u[0] % n; }
function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = rnd(i + 1); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function newDeck() { const d = []; for (let s = 0; s < 4; s++) for (let r = 2; r <= 14; r++) d.push({ r, s, id: s * 13 + r - 2 }); return d; }
const SO = [0, 1, 3, 2];
const bySuit = (a, b) => SO[a.s] - SO[b.s] || b.r - a.r;
const byRank = (a, b) => b.r - a.r || SO[a.s] - SO[b.s];
const take = (h, id) => h.splice(h.findIndex(c => c.id === id), 1)[0];
const nextAct = (s, p) => { do p = (p + 1) % s.n; while (s.out[p]); return p; };
const flash = (s, t) => { s.flash = t; s.fid = (s.fid || 0) + 1; };
const active = s => s.out.filter(x => !x).length;
const base = (g, o) => ({ g, n: o.n, names: o.names, hands: Array.from({ length: o.n }, () => []), table: [], tableMode: 'trick', out: Array(o.n).fill(false), turn: -1, msg: '', flash: null, fid: 0, over: null, pend: null });
const dealAll = (s, sorter) => { const d = shuffle(newDeck()), st = rnd(s.n); for (let p = 0; p < s.n; p++) s.hands[p] = []; d.forEach((c, i) => s.hands[(st + i) % s.n].push(c)); s.hands.forEach(h => h.sort(sorter)); };
const lo = (a, f) => a.reduce((m, c) => f(c) < f(m) ? c : m);
const hi = (a, f) => a.reduce((m, c) => f(c) > f(m) ? c : m);

/* ---------------- RUNG (4P teams, 3P solo) and BAND RUNG ---------------- */
const Rung = {
  create(o, prev) {
    const s = base(o.band ? 'band' : 'rung', o);
    s.band = !!o.band; s.T = s.n == 4 ? 13 : 17; s.minPick = s.n == 4 ? 5 : 7; s.lim = s.n == 4 ? 6 : 9;
    s.trump = null; s.sar = Array(s.n == 4 ? 2 : 3).fill(0); s.pile = 0; s.trickNo = 1; s.senior = null; s.aceWinner = null; s.caller = null; s.phase = 'draw';
    s.match = prev ? prev.match : { wins: s.sar.map(() => 0), round: 0, ptr: [0, 0], last: null };
    const m = s.match; m.round++;
    let d = shuffle(newDeck());
    if (s.n == 3) { const x = d.filter(c => c.r == 2)[rnd(4)]; d = d.filter(c => c !== x); s.removed = x; }
    s.deck = d;
    if (m.last == null) {
      if (s.band) { const w = rnd(s.n); m.ptr[w % 2] = (w >> 1) + 1; this.deal(s, w); }
      else {
        let pick, mx;
        do { pick = shuffle(newDeck()).slice(0, s.n); mx = Math.max(...pick.map(x => x.r)); } while (pick.filter(c => c.r == mx).length > 1);
        const w = pick.findIndex(c => c.r == mx);
        s.table = pick.map((c, p) => ({ c, p }));
        s.msg = 'Sab se bara patta ' + s.names[w] + ' ka: rung wohi rakhe ga';
        s.pend = { ms: 2400, kind: 'draw', w };
      }
    } else {
      let w;
      if (s.n == 4) { const t = m.last; w = [t, t + 2][m.ptr[t] % 2]; m.ptr[t]++; } else w = m.last;
      this.deal(s, w);
    }
    return s;
  },
  deal(s, w) {
    s.table = []; s.msg = ''; const d = s.deck;
    if (s.band) { for (let p = 0; p < s.n; p++) s.hands[p] = d.slice(p * s.T, (p + 1) * s.T).sort(bySuit); s.phase = 'play'; s.turn = w; }
    else { s.caller = w; for (let p = 0; p < s.n; p++) s.hands[p] = d.slice(p * 5, p * 5 + 5).sort(bySuit); s.rest = d.slice(s.n * 5); s.phase = 'pick'; s.turn = w; }
    if (s.removed) flash(s, cn(s.removed) + ' deck se nikal diya gaya');
  },
  legal(s, p) { const h = s.hands[p]; if (!s.table.length) return h.slice(); const led = s.table[0].c.s, f = h.filter(c => c.s === led); return f.length ? f : h.slice(); },
  best(s) { let b = s.table[0]; for (const x of s.table.slice(1)) { if (x.c.s === b.c.s ? x.e > b.e : x.c.s === s.trump) b = x; } return b; },
  act(s, p, a) {
    if (s.phase == 'pick') {
      const k = s.T - 5; let tr, hs, tries = 0;

/* ---------------- THULLA ---------------- */

  create(o) {

    s.turn = s.hands.findIndex(h => h.some(c => c.id === 12));

  },
  legal(s, p) { const h = s.hands[p]; if (!s.table.length) return s.first ? h.filter(c => c.id === 12) : h.slice(); const led = s.table[0].c.s, f = h.filter(c => c.s === led); return f.length ? f : h.slice(); },
  top(s) { const led = s.table[0].c.s; return hi(s.table.filter(x => x.c.s === led), x => x.c.r).p; },
  act(s, p, a) {
    const c = take(s.hands[p], a.c), led = s.table.length ? s.table[0].c.s : null;

    const act = [...Array(s.n).keys()].filter(p => !s.out[p]);

      s.over = { winners: [...Array(s.n).keys()].filter(p => p !== loser), titleWin: 'Bach gaye!', titleLose: 'Thulla lag gaya!', lines: [s.names[loser] + ' haar gaya', 'Bachne ki tarteeb: ' + s.safe.filter(p => p !== loser).map(p => s.names[p]).join(', ')] };

  ok(s, p, a) { return a.t == 'play' && this.legal(s, p).some(c => c.id === a.c); },

/* ---------------- PRESIDENT (loser = Gandu) ---------------- */
const pv = c => c.r == 2 ? 15 : c.r;

  create(o, prev) {

/* ---------------- BLUFF ---------------- */
const Bluff = {
  create(o) { const s = base('bluff', o); s.tableMode = 'row'; s.humans = o.humans || [0]; dealAll(s, byRank); s.pile = []; s.last = null; s.claim = null; s.turn = rnd(s.n); flash(s, 'Spinner: ' + s.names[s.turn] + ' shuru kare ga'); return s; },
  win(s, p) { s.turn = -1; s.over = { winners: [p], titleWin: 'Jeet gaye!', titleLose: s.names[p] + ' jeet gaya', lines: [s.names[p] + ' ke patte sab se pehle khatam'] }; },
  act(s, p, a) {

      flash(s, s.names[p] + ': CHECK! ' + (truth ? 'Sach tha, ' + s.names[p] : 'Bluff pakra gaya, ' + s.names[L.p]) + ' pile uthaye ga');
      s.pend = { ms: 2600, kind: 'reveal', truth, checker: p }; return;
    }

      const nx = (p + 1) % s.n;

  },

  bot(s, p) {

    return { hint: L ? 'Rank ' + rl(s.claim) + ' chal raha hai: 1 se 4 patte ulte phenko, pass ya check' : 'Nayi chaal: patte chuno, phir jo rank bolna hai wo chuno', btns, strip };
  },
  status(s) { return 'Bluff  ·  Pile ' + s.pile.length + (s.claim ? '  ·  Rank ' + rl(s.claim) : ''); },
  seatInfo() { return ''; }
};

/* ---------------- DAKETI ---------------- */
const pts = c => c.r == 14 ? 20 : c.r >= 11 ? 10 : 5;
const Daketi = {
  create(o) {
    const s = base('daketi', o); s.tableMode = 'row'; s.deck = shuffle(newDeck()); s.market = []; s.col = []; s.lock = []; s.final = null;
    for (let p = 0; p < s.n; p++) { s.hands[p] = s.deck.splice(0, 4).sort(byRank); s.col[p] = []; s.lock[p] = {}; }
    this.begin(s, rnd(s.n)); return s;
  },
  begin(s, p) { s.turn = p; s.drawn = null; if (s.final == null) this.draw(s, p); },
  draw(s, p) { const c = s.deck.pop(); s.hands[p].push(c); s.hands[p].sort(byRank); s.drawn = c.id; s.drawnBy = p; },
  matches(s, p) { const R = new Set(s.market.map(c => c.r)); s.col.forEach((cl, q) => cl.forEach(c => { if (!s.lock[q][c.r]) R.add(c.r); })); return s.hands[p].filter(c => R.has(c.r)); },
  score(s, p) { return s.col[p].reduce((t, c) => t + pts(c), 0); },
  act(s, p, a) {
    s.msg = '';
    if (a.t == 'cap') {
      const c = take(s.hands[p], a.c), got = [c], vic = [];
      s.market = s.market.filter(x => x.r == c.r ? (got.push(x), false) : true);
      for (let q = 0; q < s.n; q++) if (q != p && !s.lock[q][c.r]) s.col[q] = s.col[q].filter(x => x.r == c.r ? (got.push(x), vic.includes(q) || vic.push(q), false) : true);
      s.col[p].push(...got);
      if (s.col[p].filter(x => x.r == c.r).length == 4) { s.lock[p][c.r] = true; flash(s, 'LOCK! ' + s.names[p] + ' ke chaaron ' + rl(c.r)); }
      else if (vic.length) flash(s, 'DAKETI! ' + s.names[p] + ' ne ' + vic.map(q => s.names[q]).join(', ') + ' ke ' + rl(c.r) + ' chura liye');
      else s.msg = s.names[p] + ' ne ' + rl(c.r) + ' utha liya';
      s.table = s.market.map(c => ({ c }));
      if (s.final != null || !s.deck.length) return this.end(s, p);
      this.draw(s, p); return;
    }
    if (a.t == 'disc') { const c = take(s.hands[p], a.c); s.market.push(c); s.table = s.market.map(c => ({ c, p: c === s.market[s.market.length - 1] ? p : undefined })); }
    this.end(s, p);
  },
  end(s, p) {
    if (s.final != null) { if (--s.final == 0) return this.finish(s); }
    else if (!s.deck.length) { s.final = s.n; flash(s, 'Deck khatam! Sab ki ek aakhri baari'); }
    this.begin(s, (p + 1) % s.n);
  },
  finish(s) {
    const sc = s.hands.map((_, p) => this.score(s, p)), mx = Math.max(...sc); s.turn = -1;
    s.over = { winners: sc.map((v, p) => v == mx ? p : -1).filter(p => p >= 0), titleWin: 'Jeet gaye!', titleLose: 'Haar gaye!', lines: sc.map((v, p) => s.names[p] + ': ' + v + ' points' + (v == mx ? ' (winner)' : '')) };
  },
  resolve() {},
  gain(s, p, c) { let t = pts(c); s.market.forEach(x => { if (x.r == c.r) t += pts(x); }); s.col.forEach((cl, q) => { if (q != p && !s.lock[q][c.r]) cl.forEach(x => { if (x.r == c.r) t += 2 * pts(x); }); }); return t; },
  bot(s, p) {
    const m = this.matches(s, p);
    if (m.length) return { t: 'cap', c: hi(m, c => this.gain(s, p, c)).id };
    if (s.final != null) return { t: 'pass' };
    const h = s.hands[p], cnt = c => h.filter(x => x.r == c.r).length;
    return { t: 'disc', c: lo(h, c => pts(c) * 10 + cnt(c) * 30 + Math.random()).id };
  },
  ok(s, p, a) {
    const m = this.matches(s, p);
    if (a.t == 'cap') return m.some(c => c.id === a.c);
    if (a.t == 'disc') return !m.length && s.final == null && s.hands[p].some(c => c.id === a.c);
    return a.t == 'pass' && s.final != null && !m.length;
  },
  human(s, sel, opt, me) {
    const m = this.matches(s, me), fin = s.final != null;
    if (m.length) { const L = new Set(m.map(c => c.id)); return { single: true, legal: L, hint: 'Match maujood hai: chamakta patta chuno aur daketi maro' + (fin ? ' (aakhri baari, sirf ek match)' : ''), btns: [{ l: 'Match / Daketi', p: 1, d: sel.length != 1 || !L.has(sel[0].id), a: sel.length ? { t: 'cap', c: sel[0].id } : null }] }; }
    if (fin) return { single: true, legal: new Set(), hint: 'Aakhri baari: koi match nahi', btns: [{ l: 'Pass', p: 1, a: { t: 'pass' } }] };
    return { single: true, hint: 'Koi match nahi: ek patta market mein phenko', btns: [{ l: 'Market mein phenko', p: 1, d: sel.length != 1, a: sel.length ? { t: 'disc', c: sel[0].id } : null }] };
  },
  status(s) { return 'Daketi  ·  Deck ' + s.deck.length + (s.final != null ? '  ·  Aakhri baari' : ''); },
  seatInfo(s, p) {
    const cl = s.col[p], g = {}; cl.forEach(c => g[c.r] = (g[c.r] || 0) + 1);
    if (!cl.length) return '<b>0 patte · 0 pts</b>';
    const top = cl[cl.length - 1];
    const chips = Object.keys(g).sort((a, b) => b - a).map(r => '<em class="' + (s.lock[p][r] ? 'lk' : '') + '">' + rl(+r) + (s.lock[p][r] ? ' 🔒' : '×' + g[r]) + '</em>').join('');
    return '<span class="mini' + (top.s == 1 || top.s == 2 ? ' red' : '') + '">' + rl(top.r) + SUITS[top.s] + '<s>' + (s.lock[p][top.r] ? '🔒' : '×' + g[top.r]) + '</s></span><b class="dk">' + cl.length + ' patte · ' + this.score(s, p) + ' pts</b>' + chips;
  }
};

root.PB = { SUITS, rl, cn, Games: { rung: Rung, band: Rung, thulla: Thulla, president: President, bluff: Bluff, daketi: Daketi } };
})(typeof window !== 'undefined' ? window : globalThis);

};
let G, S, opts, gid, me = 0, runTok = 0, sel = new Set(), ui = { opt: null }, H = null, inputRes = null, spd = 1, lastFid = -1, tEls = new Map(), hEls = new Map(), snd = true, AC;

const LS = { get: k => { try { return localStorage.getItem(k); } catch (e) { return null; } }, set: (k, v) => { try { v == null ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch (e) {} } };
snd = LS.get('pb_snd') !== '0'; spd = +LS.get('pb_spd') || 1;
const sleep = ms => new Promise(r => setTimeout(r, ms));
const esc = t => String(t).replace(/[<>&"]/g, '');
function beep(f, d, v) { if (!snd) return; try { AC = AC || new (window.AudioContext || window.webkitAudioContext)(); const o = AC.createOscillator(), g = AC.createGain(); o.type = 'triangle'; o.frequency.value = f; g.gain.value = v || .06; o.connect(g); g.connect(AC.destination); o.start(); g.gain.exponentialRampToValueAtTime(.001, AC.currentTime + d); o.stop(AC.currentTime + d); } catch (e) {} }
function toast(t) { const e = $('toast'); e.textContent = t; e.classList.remove('go'); void e.offsetWidth; e.classList.add('go'); }
function show(id) { ['home', 'game', 'lobby'].forEach(x => $(x).hidden = x != id); }

/* ---------- home + solo setup ---------- */
function home() {
  runTok++; online = false; show('home'); closeModal();
  $('tiles').innerHTML = Object.keys(INFO).map(k => { const i = INFO[k]; return `<button class="tile" data-g="${k}" style="--c:${i.col}"><span class="ti">${i.icon}︎</span><span class="tn">${i.name}</span><span class="tt">${i.tag}</span><span class="tp">${i.players.length > 1 ? Math.min(...i.players) + '-' + Math.max(...i.players) : i.players[0]} players</span></button>`; }).join('');
}
function setup(k) {
  const i = INFO[k]; let n = i.def;
  const draw = () => modal(`<h2 style="color:${i.col}">${i.name}</h2><p class="sub">${i.tag} · bots ke saath practice</p>
    <div class="lab">Kitne players (aap + bots)</div><div class="chips">${i.players.map(p => `<button class="chip ${p == n ? 'on' : ''}" data-n="${p}">${p}</button>`).join('')}</div>
    <div class="lab">Bot ki speed</div><div class="chips"><button class="chip ${spd == 1 ? 'on' : ''}" data-s="1">Normal</button><button class="chip ${spd != 1 ? 'on' : ''}" data-s="0.55">Tez</button></div>

function modal(html, onclick) { const m = $('modal'); m.innerHTML = '<div class="sheet"><button class="x" id="mx">✕</button>' + html + '</div>'; m.hidden = false; m.onclick = e => { if (e.target === m || e.target.id == 'mx') return closeModal(); onclick && onclick(e); }; }

/* ---------- solo loop ---------- */

}

}
function submit(a) {
  if (!a) return;

  if (inputRes) { const r = inputRes; inputRes = null; r(a); }
}

/* ---------- online ---------- */
function wsSend(m) { if (ws && ws.readyState === 1) ws.send(JSON.stringify(m)); }

  try { sock = new WebSocket((location.protocol == 'https:' ? 'wss://' : 'ws://') + location.host + '/ws'); } catch (e) { return toast('Online sirf hosted link par chalta hai'); }

  };
}
function leaveRoom() { wantRoom = null; LS.set('pb_room', null); wsSend({ t: 'leave' }); const s = ws; ws = null; if (s) try { s.close(); } catch (e) {} room = null; clearTimeout(pendT); clearTimeout(overT); home(); }

    if (fresh) { resetTable(); show('game'); $('gname').textContent = INFO[gid].name + ' · ' + room.code; }
    clearTimeout(pendT); clearTimeout(overT);
    if (!S.over) $('over').hidden = true;
    render();
    if (S.turn === me && !S.pend && !S.over) beep(660, .12, .04);
    if (S.pend && ['trick', 'pickup', 'discard'].includes(S.pend.kind)) { const pd = S.pend; pendT = setTimeout(() => collect(pd), Math.max(0, pd.ms - 430)); }

  }
}
function onlineSheet() {
  const nm = esc(LS.get('pb_name') || ''), pre = (new URLSearchParams(location.search).get('room') || '').toUpperCase();
  modal(`<h2 style="color:#ffd866">Doston ke saath</h2><p class="sub">Har dost apne phone se. Khaali seat par bot.</p>

function renderLobby() {

/* ---------- rendering ---------- */
const dir = p => { const a = 2 * Math.PI * ((p - me + S.n) % S.n) / S.n; return [Math.sin(a), Math.cos(a)]; };
function cardEl(c, down) { const d = document.createElement('div'); d.className = 'card' + (down ? ' back' : (c.s == 1 || c.s == 2 ? ' red' : '')); if (!down) d.innerHTML = `<i>${rl(c.r)}<br>${SUITS[c.s]}</i><b>${SUITS[c.s]}</b>`; return d; }
function render() {
  const n = S.n, my = S.turn === me && !S.pend && !S.over, hand = S.hands[me];
  $('status').textContent = G.status(S, me);
  let h = '';
  for (let k = 1; k < n; k++) {
    const p = (me + k) % n, [sx, sy] = dir(p);
    h += `<div class="seat ${S.turn === p ? 'turn' : ''} ${S.out[p] ? 'outp' : ''}" style="left:${50 + 39 * sx}%;top:${49 + 37 * sy}%"><div class="av">${esc(S.names[p][0])}<span class="cnt">${S.hands[p].length}</span></div><div class="nm">${esc(S.names[p])}${S.turn === p ? ' · BAARI' : ''}</div><div class="inf">${G.seatInfo(S, p, me) || ''}</div></div>`;
  }
  $('seats').innerHTML = h;
  const tb = $('table'), tw = tb.clientWidth, th = tb.clientHeight, ct = $('center'), keys = new Set();
  ct.className = S.tableMode + (S.table.length > 8 ? ' many' : '');
  S.table.forEach((it, i) => {
    const k = it.c.id + (it.down ? 'd' : 'u'); keys.add(k); let el = tEls.get(k);
    if (!el) {
      el = cardEl(it.c, it.down); el.classList.add('tc'); if (it.low) el.classList.add('low');
      const [sx, sy] = it.p != null ? dir(it.p) : [0, 0];
      el.style.setProperty('--dx', sx * tw * .34 + 'px'); el.style.setProperty('--dy', sy * th * .32 + 'px');
      if (tEls.has(it.c.id + (it.down ? 'u' : 'd'))) el.classList.add('flip'); else if (it.p == null) el.classList.add('pop');
      ct.appendChild(el); tEls.set(k, el);
    }
    if (S.tableMode == 'trick') { const [sx, sy] = dir(it.p); el.style.left = 50 + 17 * sx + '%'; el.style.top = 46 + 16 * sy + '%'; el.style.zIndex = i; el.style.order = ''; }
    else { el.style.left = el.style.top = ''; el.style.order = i; }
  });
  for (const [k, el] of tEls) if (!keys.has(k)) { el.remove(); tEls.delete(k); }
  const bd = $('badge');
  if (gid == 'rung' || gid == 'band') {
    const t = S.trump, red = t == 1 || t == 2;
    bd.hidden = false;
    bd.innerHTML = t == null
      ? '<small>RUNG</small><div class="bs q">?</div><small>' + (S.band ? 'abhi band hai' : (S.caller != null ? esc(S.names[S.caller]) + ' chun raha hai' : 'faisla ho raha hai')) + '</small>'
      : '<small>RUNG</small><div class="bs ' + (red ? 'red' : '') + '">' + SUITS[t] + '</div><small>' + (S.caller === me ? 'Aap ne rakha' : esc(S.names[S.caller]) + ' ne rakha') + '</small>';
    $('hno').hidden = false; $('hno').textContent = 'Hath ' + Math.min(S.trickNo, S.T) + '/' + S.T;
  } else { bd.hidden = true; $('hno').hidden = true; }
  if (S.fid !== lastFid) { lastFid = S.fid; if (S.flash) { const f = $('flash'); f.textContent = S.flash; f.classList.remove('go'); void f.offsetWidth; f.classList.add('go'); beep(880, .18, .05); } }
  const selC = hand.filter(c => sel.has(c.id));
  H = my ? G.human(S, selC, ui.opt, me) : null;
  let btns = H ? H.btns : [];
  if (S.pend && S.pend.kind == 'window' && S.last && S.last.p !== me) btns = [{ l: 'CHECK!', cls: 'warn', a: { t: 'check' } }];
  const who = S.over ? '' : my ? '👉 AAP KI BAARI' : S.turn >= 0 ? 'Baari: ' + esc(S.names[S.turn]) : '';
  $('msg').innerHTML = (S.msg ? '<span>' + esc(S.msg) + '</span>' : '') + (who ? '<span class="' + (my ? 'you' : '') + '">' + who + '</span>' : '');
  $('hint').textContent = H ? H.hint || '' : (S.out[me] ? 'Aap nikal gaye, ab tamasha dekho' : '');
  $('meinf').innerHTML = (online ? '<b>' + esc(S.names[me]) + '</b> ' : '') + (G.seatInfo(S, me, me) || '').replace(/^Rung/, 'Rung aap ne rakha');
  $('game').classList.toggle('myturn', my);
  $('strip').innerHTML = H && H.strip ? H.strip.map(o => `<button class="chip ${o.on ? 'on' : ''}" data-v="${o.v}">${o.l}</button>`).join('') : '';
  const bb = $('btns'); bb.innerHTML = '';
  btns.forEach(b => { const e = document.createElement('button'); e.className = 'btn ' + (b.p ? 'pri ' : '') + (b.cls || ''); e.textContent = b.l; e.disabled = !!b.d; e.onclick = () => submit(b.a); bb.appendChild(e); });
  renderHand();
}
function renderHand() {
  const hd = $('hand'), cards = S.hands[me], n = cards.length, W = hd.clientWidth, cw = W < 380 ? 52 : 60, chh = cw * 1.42;
  const rows = Math.max(1, Math.ceil(n / 13)), per = Math.ceil(n / rows), rowGap = chh * .5, keys = new Set();
  hd.style.height = (n ? chh + (rows - 1) * rowGap + 18 : 30) + 'px'; hd.style.setProperty('--cw', cw + 'px');
  cards.forEach((c, i) => {
    keys.add(c.id); let el = hEls.get(c.id);
    if (!el) { el = cardEl(c); el.classList.add('hc', 'deal'); el.style.animationDelay = Math.min(i * 28, 500) + 'ms'; el.onclick = () => tapCard(c.id); hd.appendChild(el); hEls.set(c.id, el); }
    const r = Math.floor(i / per), j = i % per, m = Math.min(per, n - r * per), sp = m > 1 ? Math.min(cw + 6, (W - 10 - cw) / (m - 1)) : 0, x0 = (W - (cw + sp * (m - 1))) / 2;
    el.style.left = x0 + j * sp + 'px'; el.style.top = 16 + r * rowGap + 'px'; el.style.zIndex = i;
    el.classList.toggle('sel', sel.has(c.id));
    el.classList.toggle('dim', !!(H && H.legal && !H.legal.has(c.id)));
    el.classList.toggle('glow', !!(H && H.legal && H.legal.size && H.legal.has(c.id) && gid == 'daketi'));
    el.classList.toggle('new', S.drawn === c.id && (online || S.drawnBy === me));
    el.classList.toggle('low', !!(H && H.lowIds && H.lowIds.has(c.id)));
  });
  for (const [k, el] of hEls) if (!keys.has(k)) { el.remove(); hEls.delete(k); }
}
function tapCard(id) {
  if (!H) return;
  if (H.legal && !H.legal.has(id)) { const e = hEls.get(id); e.classList.remove('shake'); void e.offsetWidth; e.classList.add('shake'); return; }
  if (H.single) { if (sel.has(id)) { const c = S.hands[me].filter(x => sel.has(x.id)); const b = G.human(S, c, ui.opt, me).btns.find(b => b.p && !b.d); if (b) return submit(b.a); } sel.clear(); sel.add(id); }
  else if (sel.has(id)) sel.delete(id); else if (sel.size < 4) sel.add(id);
  ui.opt = null; beep(520, .04, .03); render();
}
function collect(pd) {
  const tb = $('table'), [sx, sy] = pd.kind == 'discard' ? [0, 0] : dir(pd.w);
  tEls.forEach(el => { el.style.transition = 'transform .42s ease-in, opacity .42s'; el.style.transform = `translate(${sx * tb.clientWidth * .36}px,${sy * tb.clientHeight * .34}px) scale(.35) rotate(${pd.kind == 'discard' ? 0 : 25}deg)`; el.style.opacity = 0; });
  beep(pd.kind == 'pickup' ? 150 : 440, .15);
}
function showOver() {
  if (!S || !S.over) return;
  const o = S.over, win = o.winners.includes(me), title = (o.top === me && o.titleTop) || (win ? o.titleWin : o.titleLose), canNext = o.next;
  $('over').hidden = false;
  $('over').innerHTML = `<div class="ocard ${win ? 'win' : 'lose'}"><div class="oemo">${win ? '🏆' : '😵'}</div><h2>${esc(title)}</h2>${o.lines.map(l => '<p>' + esc(l) + '</p>').join('')}${o.log ? '<details class="log"><summary>Har hath ka hisaab dekho</summary>' + o.log.map(l => '<div>' + l + '</div>').join('') + '</details>' : ''}<button class="big" id="again">${canNext ? 'Agla round' : 'Dobara khelo'}</button><button class="ghost" id="tohome">${online ? (room && room.host ? 'Lobby (game badlo)' : 'Room chhor do') : 'Home'}</button></div>` + (win ? Array.from({ length: 36 }, (_, i) => `<i class="conf" style="left:${Math.random() * 100}%;background:hsl(${i * 37},90%,60%);animation-delay:${Math.random() * .8}s;animation-duration:${1.8 + Math.random() * 1.6}s"></i>`).join('') : '');
  beep(win ? 784 : 180, .4, .07);
  $('again').onclick = () => online ? wsSend({ t: 'next' }) : start(gid, opts.n, canNext ? S : null);
  $('tohome').onclick = () => online ? (room && room.host ? wsSend({ t: 'lobby' }) : leaveRoom()) : home();
}

/* ---------- events ---------- */
$('tiles').onclick = e => { const t = e.target.closest('.tile'); if (t) setup(t.dataset.g); };
$('onl').onclick = onlineSheet;
$('back').onclick = () => modal('<h2>Game chhor dein?</h2><p class="sub">' + (online ? 'Aap room se nikal jayenge, aap ki jagah bot khele ga.' : 'Yeh round khatam ho jaye ga.') + '</p><button class="big" id="yes">Haan, Home</button>', e => { if (e.target.id == 'yes') online ? leaveRoom() : home(); });
$('help').onclick = () => modal(`<h2 style="color:${INFO[gid].col}">${INFO[gid].name}: rules</h2><ul class="rules">${INFO[gid].rules.map(r => '<li>' + r + '</li>').join('')}</ul>${S.log && S.log.length ? '<h2 style="font-size:19px">Ab tak ke hath</h2><div class="log open">' + S.log.map(l => '<div>' + l + '</div>').join('') + '</div>' : ''}`);
$('snd').onclick = () => { snd = !snd; LS.set('pb_snd', snd ? '1' : '0'); $('snd').textContent = snd ? '🔊' : '🔇'; };
$('snd').textContent = snd ? '🔊' : '🔇';
$('strip').onclick = e => { const t = e.target.closest('.chip'); if (t) { ui.opt = +t.dataset.v; render(); } };
let rz; window.addEventListener('resize', () => { clearTimeout(rz); rz = setTimeout(() => { if (S && !$('game').hidden) render(); }, 120); });
home();
const qRoom = (new URLSearchParams(location.search).get('room') || '').toUpperCase(), saved = LS.get('pb_room');
if (/^https?:$/.test(location.protocol) && LS.get('pb_name')) {
  if (saved && LS.get('pb_tok') && (!qRoom || qRoom == saved)) { wantRoom = saved; connect(() => wsSend({ t: 'join', code: saved, token: LS.get('pb_tok'), name: LS.get('pb_name') })); }
  else if (qRoom) onlineSheet();
} else if (qRoom) onlineSheet();
})();
</script>
